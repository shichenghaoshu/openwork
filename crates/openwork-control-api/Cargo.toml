[package]
name = "openwork-control-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
openwork-core = { path = "../openwork-core" }
openwork-execution = { path = "../openwork-execution", features = ["postgres"] }
openwork-runtime = { path = "../openwork-runtime" }
openwork-sandbox = { path = "../openwork-sandbox" }
openwork-worker = { path = "../openwork-worker" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { version = "=0.8.6", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio-rustls", "time", "uuid"] }
subtle = "=2.6.1"
time = { workspace = true, features = ["serde"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "time"] }
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = { version = "=0.5.3", features = ["util"] }

[lints]
workspace = true
