[workspace]
members = [
  "crates/openwork-cli",
  "crates/openwork-config",
  "crates/openwork-core",
  "crates/openwork-doctor",
  "crates/openwork-installer",
  "crates/openwork-platform",
  "crates/openwork-runtime",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/shichenghaoshu/openwork"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
atomicwrites = "0.4.4"
clap = { version = "4.6.4", features = ["derive"] }
fs2 = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.27.0"
