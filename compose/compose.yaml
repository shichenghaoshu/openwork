name: openwork

services:
  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    restart: unless-stopped
    environment:
      POSTGRES_DB: openwork
      POSTGRES_USER: openwork
      POSTGRES_PASSWORD: ${OPENWORK_DB_PASSWORD:?set OPENWORK_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwork -d openwork"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [control]
    security_opt: ["no-new-privileges:true"]

  openwork-control-api:
    build:
      context: ..
      dockerfile: compose/Dockerfile.control-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENWORK_DATABASE_URL: postgresql://openwork:${OPENWORK_DB_PASSWORD}@postgres/openwork
      OPENWORK_API_TOKEN: ${OPENWORK_API_TOKEN:?set OPENWORK_API_TOKEN}
      OPENWORK_API_ACTOR: ${OPENWORK_API_ACTOR:-control-admin}
      OPENWORK_CONTROL_BIND: 0.0.0.0:8080
      OPENWORK_WORKSPACE_ROOT: /workspaces
      # This hardened control-plane container intentionally has no container
      # engine socket. Run creation therefore fails closed until a separately
      # configured host deployment enables the in-process worker.
      OPENWORK_WORKER_ENABLED: "0"
    ports: ["127.0.0.1:${OPENWORK_CONTROL_PORT:-8080}:8080"]
    volumes:
      - type: bind
        source: ${OPENWORK_HOST_WORKSPACE_ROOT:?set OPENWORK_HOST_WORKSPACE_ROOT}
        target: /workspaces
        read_only: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/openwork-control-api", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Keep database traffic on the internal network while a separate ingress
    # bridge makes the loopback-published HTTP port reachable from the host.
    networks: [control, ingress]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  litellm:
    profiles: [gateway]
    image: ghcr.io/berriai/litellm:main-v1.77.7-stable@sha256:cc6255644a32511355bc53c5d4d0ca7b3c5df45ad881225ff57e8a88e083c563
    command: ["--host", "0.0.0.0", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
    ports: ["127.0.0.1:${OPENWORK_LITELLM_PORT:-4000}:4000"]
    networks: [control, gateway-egress]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  control:
    internal: true
  ingress:
  gateway-egress:

volumes:
  postgres-data:
