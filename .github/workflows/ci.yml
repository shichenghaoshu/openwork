name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Draft and ready events use distinct groups, so a skipped draft run cannot
  # replace either a running or pending full gate.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft' || 'ready' }}
  cancel-in-progress: true

jobs:
  lint:
    name: "${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft-skip: lint' || 'lint' }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  typecheck:
    name: "${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft-skip: typecheck' || 'typecheck' }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo check --workspace --all-targets --locked

  unit:
    name: "${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft-skip: unit' || 'unit' }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace --lib --locked

  integration:
    name: "${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft-skip: integration' || 'integration' }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace --tests --locked

  real-docker-e2e:
    name: "${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft-skip: real-docker-e2e' || 'real-docker-e2e' }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    env:
      OPENWORK_REAL_DOCKER_TESTS: '1'
      OPENWORK_DOCKER_BIN: /usr/bin/docker
      OPENWORK_SALES_SANDBOX_IMAGE: docker.io/library/busybox@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
    steps:
      - uses: actions/checkout@v4
      - name: Pull the digest-pinned analyzer image
        run: docker pull "$OPENWORK_SALES_SANDBOX_IMAGE"
      - name: Run the real Docker sandbox lifecycle
        run: cargo test -p openwork-e2e --test real_docker_sales --locked -- --ignored --nocapture

  postgres-concurrency:
    name: "${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft-skip: postgres-concurrency' || 'postgres-concurrency' }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_DB: openwork_test
          POSTGRES_USER: openwork
          POSTGRES_PASSWORD: openwork-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openwork -d openwork_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      OPENWORK_TEST_DATABASE_URL: postgresql://openwork:openwork-test-password@127.0.0.1:5432/openwork_test
      OPENWORK_TEST_DATABASE_RESET: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Run real Postgres CAS and recovery races
        run: cargo test -p openwork-execution --features postgres --test postgres_concurrency --locked -- --nocapture

  build:
    name: "${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft-skip: build' || 'build' }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked
      - run: test "$(target/release/openwork --version)" = "OpenWork 0.1.0"

  clippy:
    name: "${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft-skip: clippy' || 'clippy' }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  compose-smoke:
    name: "${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft-skip: compose-smoke' || 'compose-smoke' }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the production Compose model
        env:
          OPENWORK_DB_PASSWORD: compose-smoke-password
          OPENWORK_API_TOKEN: compose-smoke-token-0123456789abcdef
          OPENWORK_HOST_WORKSPACE_ROOT: ${{ github.workspace }}/samples
        run: docker compose -f compose/compose.yaml config --quiet
      - name: Start Postgres and the Control API
        env:
          OPENWORK_DB_PASSWORD: compose-smoke-password
          OPENWORK_API_TOKEN: compose-smoke-token-0123456789abcdef
          OPENWORK_HOST_WORKSPACE_ROOT: ${{ github.workspace }}/samples
        run: |
          trap 'docker compose -f compose/compose.yaml down --volumes' EXIT
          docker compose -f compose/compose.yaml up --detach --build --wait postgres openwork-control-api
          curl --fail --silent --show-error http://127.0.0.1:8080/health
          run_json=$(curl --fail --silent --show-error \
            --header 'Authorization: Bearer compose-smoke-token-0123456789abcdef' \
            --header 'Content-Type: application/json' \
            --data '{"runtime":"codex","workspace":"sales","prompt":"compose smoke prompt"}' \
            http://127.0.0.1:8080/v1/runs)
          run_id=$(jq -er '.id' <<<"$run_json")
          test "$(jq -r '.status' <<<"$run_json")" = queued
          test "$(jq -r 'has("prompt")' <<<"$run_json")" = false
          cancel_json=$(curl --fail --silent --show-error \
            --request POST \
            --header 'Authorization: Bearer compose-smoke-token-0123456789abcdef' \
            "http://127.0.0.1:8080/v1/runs/$run_id/cancel")
          test "$(jq -r '.status' <<<"$cancel_json")" = cancelled
          test "$(jq -r '.confirmed' <<<"$cancel_json")" = true
          curl --fail --silent --show-error \
            --header 'Authorization: Bearer compose-smoke-token-0123456789abcdef' \
            "http://127.0.0.1:8080/v1/runs/$run_id/events" \
            | jq -e 'map(.event_type) == ["run_created", "cancel_confirmed"]'
          test "$(docker compose -f compose/compose.yaml exec -T postgres \
            psql -U openwork -d openwork -Atc 'SELECT MAX(version) FROM _sqlx_migrations')" = 4

  pack-validation:
    name: "${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft-skip: pack-validation' || 'pack-validation' }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test ! -e contracts/schemas/capability-pack.v1.schema.json

  license-check:
    name: "${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft-skip: license-check' || 'license-check' }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -s LICENSE && test -s NOTICE && test -s THIRD_PARTY_NOTICES.md
      - run: cargo metadata --format-version 1 --locked > /tmp/openwork-cargo-metadata.json
      - run: '! jq -e ''.packages[] | select(.license == null)'' /tmp/openwork-cargo-metadata.json'

  sbom:
    name: "${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft-skip: sbom' || 'sbom' }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo metadata --format-version 1 --locked > /tmp/openwork-cargo-sbom-input.json
      - run: test -s /tmp/openwork-cargo-sbom-input.json

  secret-scan:
    name: "${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft-skip: secret-scan' || 'secret-scan' }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject common committed secret formats
        run: '! git grep -nE "(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)"'

  codeql-or-sast:
    name: "${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft-skip: codeql-or-sast' || 'codeql-or-sast' }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL for Rust
        uses: github/codeql-action/init@v4.36.0
        with:
          languages: rust
          build-mode: none
      - name: Analyze Rust sources
        uses: github/codeql-action/analyze@v4.36.0

  container-scan:
    name: "${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft-skip: container-scan' || 'container-scan' }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployed Control API image
        run: docker build --file compose/Dockerfile.control-api --tag openwork-control-api:ci .
      - name: Scan the deployed image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: openwork-control-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

  docs-links:
    name: "${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft-skip: docs-links' || 'docs-links' }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-doc-links.mjs
